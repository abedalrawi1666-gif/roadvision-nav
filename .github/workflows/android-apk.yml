name: Build RoadVision Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - roadvision-new

permissions:
  contents: read

jobs:
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get project source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: Create Android files and permissions
        run: |
          flutter create --platforms=android --project-name roadvision_nav .
          python3 scripts/configure_platforms.py
          flutter pub get

      - name: Configure Mapbox private SDK download access if supplied
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          if [ -n "$MAPBOX_DOWNLOADS_TOKEN" ]; then
            mkdir -p ~/.gradle
            printf 'MAPBOX_DOWNLOADS_TOKEN=%s\n' "$MAPBOX_DOWNLOADS_TOKEN" >> ~/.gradle/gradle.properties
          fi

      - name: Build release APK
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          if [ -z "$MAPBOX_PUBLIC_TOKEN" ]; then
            echo '::warning::MAPBOX_PUBLIC_TOKEN is missing. The 3D map will not work.'
          fi
          flutter build apk --release --dart-define=MAPBOX_PUBLIC_TOKEN="$MAPBOX_PUBLIC_TOKEN"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoadVision-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
