name: roadvision_nav
description: Arabic-first cross-platform navigation prototype with 3D maps and camera guidance.
publish_to: none
version: 0.4.0+4

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  mapbox_maps_flutter: 2.12.0
  camera: ^0.11.1
  geolocator: ^13.0.2
  http: ^1.3.0
  flutter_tts: ^4.2.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
